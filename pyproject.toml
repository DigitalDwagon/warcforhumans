[build-system]
requires = ["uv_build>=0.12.17,<1.0.0"]
build-backend = "uv_build"


[project]
name = "warcforhumans"
version = "1.0.0a4"
description = ""
authors = []
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "zstandard",
    "h11 (>=0.16.0,<0.17.0)",
    "requests (>=2.32.5,<3.0.0)",
    "typing-extensions (>=4.15.0,<5.0.0)",
]

[dependency-groups]
dev = [
    "pytest",
    "basedpyright"
]

[tool.pytest]
minversion = "9.0"
addopts = ["-ra", "-q"]
testpaths = [
    "tests"
]

[tool.uv.build-backend]
module-name = ["warcforhumans"]
module-root = ""
